version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: extraalayer-postgres
    environment:
      POSTGRES_USER: extraalayer
      POSTGRES_PASSWORD: extraalayer_password
      POSTGRES_DB: extraalayer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extraalayer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - extraalayer-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extraalayer-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://extraalayer:extraalayer_password@postgres:5432/extraalayer_db
      PORT: 3000
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_change_in_production
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - extraalayer-network

volumes:
  postgres_data:

networks:
  extraalayer-network:
    driver: bridge
